<!DOCTYPE html><html lang="id" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#04162c",
            "primary-container": "#1a2b42",
            "secondary": "#a83442",
            "secondary-container": "#fe757f",
            "on-primary": "#ffffff",
            "on-secondary": "#ffffff",
            "surface": "#0a111a",
            "surface-container": "#121b28",
            "tertiary": "#0e141c",
            "outline": "#74777e",
            "outline-variant": "#c4c6cd",
            "success-mint": "#00d589"
          },
          fontFamily: {
            "display": ["Hanken Grotesk", "sans-serif"],
            "headline": ["Hanken Grotesk", "sans-serif"],
            "body": ["Inter", "sans-serif"],
            "mono": ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
<style>
    @layer base {
      html, body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        overscroll-behavior: none;
        background-color: #04162c;
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
    }
    @keyframes laserSweep {
      0% { transform: translateY(0%); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translateY(320px); opacity: 0; }
    }
    .scanner-laser {
      animation: laserSweep 2.4s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-primary text-white font-body antialiased flex flex-col h-screen w-screen relative overflow-hidden">
<!-- ==================== CAMERA LIVE VIEWFINDER BACKGROUND ==================== -->
<div class="absolute inset-0 z-0 bg-black">
<img alt="Kamera preview dokumen" class="w-full h-full object-cover select-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD6G5s-QhhxZaOoyZlw6XhMEl2vUPXl5fxhHRH-fICDe6QgWfGhVtpZIAys4tho28i9MZ3hdSy8nmflRNNDIMu0Wm9gfnn6EWtkTSVTXGhWWy8Ng8lJrsrxA0worcK4_gQQ1tiO0LcauyG5WH0NMJU6qWEgcmCEpPzH7rgG7MxOwlNEJ-9O_wJx8pIZrEKPlMVs4SiYveEsahdvyhWI56oPfF2YCeLDKWhm0g0iQF72JTJPZpQjYJYW9Q">
<!-- Subtle edge vignette scrim for high contrast overlay -->
<div class="absolute inset-0 bg-gradient-to-b from-primary/90 via-transparent to-primary/95 pointer-events-none"></div>
</div>
<!-- ==================== TOP BAR: STATUS & CAMERA CONTROLS ==================== -->
<header class="relative z-30 w-full pt-safe">
<!-- Android Transparent Status Bar -->
<div class="flex items-center justify-between px-6 py-2 text-white/90 text-xs font-mono tracking-tight">
<span class="font-semibold text-[13px]">09:41</span>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[15px] opacity-80">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[15px] opacity-80">wifi</span>
<div class="flex items-center gap-1">
<span class="text-[11px] font-mono">92%</span>
<span class="material-symbols-outlined text-[17px] -rotate-90">battery_full</span>
</div>
</div>
</div>
<!-- Quick Camera Action Bar -->
<div class="flex items-center justify-between px-4 py-2.5">
<!-- Tombol Tutup / Kembali -->
<button aria-label="Tutup kamera" class="w-11 h-11 rounded-full bg-primary/70 hover:bg-primary/90 text-white flex items-center justify-center backdrop-blur-md border border-white/10 active:scale-90 transition-all shadow-md" id="btn-close">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<!-- Tombol Flash Tengah (Auto / On / Off) -->
<div class="flex items-center gap-1 bg-primary/70 backdrop-blur-md px-1.5 py-1 rounded-full border border-white/10 shadow-md">
<button class="flex items-center gap-1.5 px-3 py-1 rounded-full text-white hover:text-white/90 active:scale-95 transition-all text-xs font-mono font-medium" id="btn-flash">
<span class="material-symbols-outlined text-[18px] text-amber-300" id="flash-icon">flash_auto</span>
<span class="tracking-wide text-[11px]" id="flash-label">AUTO</span>
</button>
</div>
<!-- Tombol Grid & Pengaturan -->
<div class="flex items-center gap-2">
<button aria-label="Toggle grid panduan" class="w-11 h-11 rounded-full bg-primary/70 hover:bg-primary/90 text-white flex items-center justify-center backdrop-blur-md border border-white/10 active:scale-90 transition-all shadow-md" id="btn-grid">
<span class="material-symbols-outlined text-[22px]" id="grid-icon">grid_4x4</span>
</button>
</div>
</div>
<!-- Panduan / Petunjuk Ringkas & Horizon Gyro -->
<div class="flex flex-col items-center justify-center gap-1.5 px-4 mt-1">
<div class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-primary/80 backdrop-blur-md border border-white/10 shadow-md">
<span class="w-2 h-2 rounded-full bg-success-mint animate-ping"></span>
<span class="text-xs font-body text-white/90 font-medium">Posisikan dokumen di dalam bingkai</span>
<span class="text-white/30">•</span>
<div class="flex items-center gap-1 text-[11px] font-mono text-white/80">
<span class="material-symbols-outlined text-[13px] text-white/70">screen_rotation</span>
<span class="">0.0°</span>
</div>
</div>
</div>
</header>
<!-- ==================== MAIN VIEWFINDER & REALTIME BOUNDING BOX ==================== -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-6 py-2">
<!-- Framing Container -->
<div class="relative w-full max-w-[340px] aspect-[1/1.414] flex items-center justify-center">
<!-- Optional Grid Overlay -->
<div class="absolute inset-0 grid grid-cols-3 grid-rows-3 pointer-events-none opacity-20 border border-white/20" id="grid-overlay">
<div class="border-r border-b border-white/30"></div>
<div class="border-r border-b border-white/30"></div>
<div class="border-b border-white/30"></div>
<div class="border-r border-b border-white/30"></div>
<div class="border-r border-b border-white/30"></div>
<div class="border-b border-white/30"></div>
<div class="border-r border-white/30"></div>
<div class="border-r border-white/30"></div>
<div></div>
</div>
<!-- Realtime Edge-Detected Bounding Box -->
<div class="absolute inset-2 border-2 border-secondary/85 rounded-sm bg-secondary/5 shadow-[0_0_24px_rgba(168,52,66,0.35)] transition-all duration-200">
<!-- Laser Sweep Line -->
<div class="scanner-laser absolute inset-x-0 top-0 h-[2px] bg-gradient-to-r from-transparent via-secondary-container to-transparent shadow-[0_0_8px_#fe757f]"></div>
<!-- 4 Precision Corner L-Brackets -->
<!-- Top Left -->
<div class="absolute -top-1 -left-1 w-6 h-6 border-t-[3.5px] border-l-[3.5px] border-secondary shadow-sm"></div>
<!-- Top Right -->
<div class="absolute -top-1 -right-1 w-6 h-6 border-t-[3.5px] border-r-[3.5px] border-secondary shadow-sm"></div>
<!-- Bottom Left -->
<div class="absolute -bottom-1 -left-1 w-6 h-6 border-b-[3.5px] border-l-[3.5px] border-secondary shadow-sm"></div>
<!-- Bottom Right -->
<div class="absolute -bottom-1 -right-1 w-6 h-6 border-b-[3.5px] border-r-[3.5px] border-secondary shadow-sm"></div>
<!-- Corner Anchor Dot Indicators -->
<span class="absolute -top-[5px] -left-[5px] w-2.5 h-2.5 rounded-full bg-white ring-2 ring-secondary shadow-sm"></span>
<span class="absolute -top-[5px] -right-[5px] w-2.5 h-2.5 rounded-full bg-white ring-2 ring-secondary shadow-sm"></span>
<span class="absolute -bottom-[5px] -left-[5px] w-2.5 h-2.5 rounded-full bg-white ring-2 ring-secondary shadow-sm"></span>
<span class="absolute -bottom-[5px] -right-[5px] w-2.5 h-2.5 rounded-full bg-white ring-2 ring-secondary shadow-sm"></span>
<!-- Center Crosshair / Focus Reticle -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-40">
<span class="material-symbols-outlined text-[32px] text-white font-light">filter_center_focus</span>
</div>
</div>
<!-- Detection Status Floating Badge -->

</div>
</main>
<!-- ==================== BOTTOM DECK: CAMERA CONTROLS (NO BOTTOM NAV BAR) ==================== -->
<footer class="relative z-30 w-full bg-gradient-to-t from-primary via-primary/95 to-primary/70 backdrop-blur-xl border-t border-white/10 pt-3 pb-safe">
<!-- 1. Mode Selector Tabs -->
<div class="flex items-center justify-center gap-6 pb-4">
<button class="mode-btn text-xs font-mono text-white/60 hover:text-white transition-colors" data-mode="idcard">
        KTP / ID Card
      </button>
<button class="mode-btn text-xs font-headline font-bold text-white relative py-1 transition-colors" data-mode="single">
        Dokumen Tunggal
        <span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-5 h-0.5 bg-secondary rounded-full"></span>
</button>
<button class="mode-btn text-xs font-mono text-white/60 hover:text-white transition-colors" data-mode="multi">
        Multi-Halaman
      </button>
</div>
<!-- 2. Shutter Control Row -->
<div class="flex items-center justify-between max-w-sm mx-auto px-8 pb-3">
<!-- Sisi Kiri: Impor Gambar / Galeri -->
<button class="flex flex-col items-center justify-center gap-1 group active:scale-95 transition-transform" id="btn-gallery">
<div class="w-12 h-12 rounded-xl bg-surface-container border border-white/15 overflow-hidden flex items-center justify-center relative shadow-md group-hover:border-white/30">
<img alt="Preview Galeri" class="w-full h-full object-cover opacity-75 group-hover:opacity-100 transition-opacity" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCxgLeI1A495mN17KyvpuXZ4cVGFjljcPJOXaKrVS90arEFKOQbNJSDHvQbMNKyK3P1wY3GAUWQpHt2VcwWbBhlAjyvFxyeeZWAHNE_d5hgFIwBiayhh440ybOPSxSYCFsBeTsbyvfskTx73S88Qqv63VDV4d3aTTfTw8Gx4agObnf-HUpZLihtm3Ox6PN5KNtWJNHlJafS4zn4kK1kIX167Cplrl9Yip1R3f6gnWXj0uv_S3boLZRiQA">
<span class="material-symbols-outlined text-[16px] text-white absolute bottom-1 right-1 bg-black/60 rounded p-0.5">photo_library</span>
</div>
<span class="text-[11px] font-mono text-white/70">Galeri</span>
</button>
<!-- Tengah: Shutter Button Elegan (Ring Maroon + Tombol Putih) -->
<div class="relative flex items-center justify-center">
<!-- Pulse Glow saat auto-capture siap -->
<div class="absolute -inset-2.5 rounded-full bg-secondary/30 animate-pulse pointer-events-none" id="shutter-pulse"></div>
<!-- Outer Maroon Ring -->
<button aria-label="Ambil Foto Dokumen" class="w-20 h-20 rounded-full border-4 border-secondary p-1 flex items-center justify-center active:scale-90 transition-transform duration-150 shadow-[0_4px_24px_rgba(168,52,66,0.45)] focus:outline-none bg-primary" id="btn-shutter">
<!-- Inner Solid Shutter Core -->
<span class="w-full h-full rounded-full bg-white flex items-center justify-center active:bg-white/80 transition-colors shadow-inner">
<span class="w-3.5 h-3.5 rounded-full bg-secondary/30"></span>
</span>
</button>
</div>
<!-- Sisi Kanan: Toggle Mode Otomatis / Manual -->
<button class="flex flex-col items-center justify-center gap-1 group active:scale-95 transition-transform" id="btn-auto">
<div class="w-12 h-12 rounded-xl bg-surface-container border border-white/15 flex flex-col items-center justify-center relative shadow-md group-hover:border-white/30">
<span class="w-2 h-2 rounded-full bg-success-mint absolute top-1.5 right-1.5" id="auto-indicator"></span>
<span class="material-symbols-outlined text-[22px] text-white">hdr_auto</span>
</div>
<span class="text-[11px] font-mono text-success-mint font-semibold" id="auto-label">Otomatis</span>
</button>
</div>
<!-- 3. Offline & Security Notice Footnote -->
<div class="flex items-center justify-center gap-1.5 pb-2 opacity-60">
<span class="material-symbols-outlined text-[13px] text-white">verified_user</span>
<span class="font-mono text-[10px] uppercase tracking-wider text-white/90">Pemrosesan 100% Offline</span>
</div>
</footer>
<!-- ==================== MICRO-INTERACTION SCRIPTS ==================== -->
<script>
    // Flash Toggle
    const flashBtn = document.getElementById('btn-flash');
    const flashIcon = document.getElementById('flash-icon');
    const flashLabel = document.getElementById('flash-label');
    const flashStates = [
      { mode: 'AUTO', icon: 'flash_auto', color: 'text-amber-300' },
      { mode: 'ON', icon: 'flash_on', color: 'text-yellow-400' },
      { mode: 'OFF', icon: 'flash_off', color: 'text-white/60' }
    ];
    let flashIdx = 0;
    if (flashBtn) {
      flashBtn.addEventListener('click', () => {
        flashIdx = (flashIdx + 1) % flashStates.length;
        const current = flashStates[flashIdx];
        flashIcon.textContent = current.icon;
        flashLabel.textContent = current.mode;
        flashIcon.className = `material-symbols-outlined text-[18px] ${current.color}`;
      });
    }

    // Grid Toggle
    const gridBtn = document.getElementById('btn-grid');
    const gridOverlay = document.getElementById('grid-overlay');
    let gridVisible = true;
    if (gridBtn && gridOverlay) {
      gridBtn.addEventListener('click', () => {
        gridVisible = !gridVisible;
        gridOverlay.classList.toggle('hidden', !gridVisible);
        gridBtn.classList.toggle('text-secondary-container', !gridVisible);
      });
    }

    // Auto / Manual Capture Toggle
    const autoBtn = document.getElementById('btn-auto');
    const autoIndicator = document.getElementById('auto-indicator');
    const autoLabel = document.getElementById('auto-label');
    const shutterPulse = document.getElementById('shutter-pulse');
    let isAutoMode = true;

    if (autoBtn) {
      autoBtn.addEventListener('click', () => {
        isAutoMode = !isAutoMode;
        if (isAutoMode) {
          autoLabel.textContent = 'Otomatis';
          autoLabel.className = 'text-[11px] font-mono text-success-mint font-semibold';
          autoIndicator.className = 'w-2 h-2 rounded-full bg-success-mint absolute top-1.5 right-1.5';
          shutterPulse.classList.remove('hidden');
        } else {
          autoLabel.textContent = 'Manual';
          autoLabel.className = 'text-[11px] font-mono text-white/70 font-semibold';
          autoIndicator.className = 'w-2 h-2 rounded-full bg-white/40 absolute top-1.5 right-1.5';
          shutterPulse.classList.add('hidden');
        }
      });
    }

    // Shutter Click Feedback & Simulation
    const shutterBtn = document.getElementById('btn-shutter');
    if (shutterBtn) {
      shutterBtn.addEventListener('click', () => {
        if (window.navigator && window.navigator.vibrate) {
          window.navigator.vibrate(50);
        }
        // Flash screen white briefly
        const flashScreen = document.createElement('div');
        flashScreen.className = 'fixed inset-0 bg-white z-50 pointer-events-none transition-opacity duration-200 opacity-80';
        document.body.appendChild(flashScreen);
        setTimeout(() => {
          flashScreen.classList.add('opacity-0');
          setTimeout(() => flashScreen.remove(), 200);
        }, 80);
      });
    }

    // Mode Selector Switcher
    const modeBtns = document.querySelectorAll('.mode-btn');
    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        modeBtns.forEach(b => {
          b.className = 'mode-btn text-xs font-mono text-white/60 hover:text-white transition-colors relative py-1';
          const indicator = b.querySelector('span');
          if (indicator) indicator.remove();
        });
        btn.className = 'mode-btn text-xs font-headline font-bold text-white relative py-1 transition-colors';
        const indicator = document.createElement('span');
        indicator.className = 'absolute bottom-0 left-1/2 -translate-x-1/2 w-5 h-0.5 bg-secondary rounded-full';
        btn.appendChild(indicator);
      });
    });

    // Close button dismiss simulation
    const closeBtn = document.getElementById('btn-close');
    if (closeBtn) {
      closeBtn.addEventListener('click', () => {
        if (window.history && window.history.length > 1) {
          window.history.back();
        }
      });
    }
  </script>
</body></html>
